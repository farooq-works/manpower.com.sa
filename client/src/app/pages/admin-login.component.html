<section class="mx-auto max-w-md px-6 py-16">
  <a routerLink="/" class="text-sm font-semibold text-red-700">← Back to site</a>
  <h1 class="mt-6 text-3xl font-bold">Admin sign in</h1>
  <p class="mt-2 text-gray-600">Sign in to edit page content and manage images.</p>

  <form class="mt-8 space-y-5" (ngSubmit)="submit()">
    <label class="block text-sm font-semibold">
      Email
      <input
        class="mt-2 w-full rounded border border-gray-300 px-3 py-2 font-normal"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="username"
        required
      />
    </label>
    <label class="block text-sm font-semibold">
      Password
      <input
        class="mt-2 w-full rounded border border-gray-300 px-3 py-2 font-normal"
        type="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        required
      />
    </label>
    @if (error) {
      <p class="text-sm text-red-700" role="alert">{{ error }}</p>
    }
    <button
      class="w-full rounded bg-red-700 px-4 py-3 font-semibold text-white disabled:opacity-60"
      type="submit"
      [disabled]="submitting"
    >
      {{ submitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</section>
