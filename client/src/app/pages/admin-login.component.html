<main class="login-page">
  <div class="login-decoration login-decoration-one"></div>
  <div class="login-decoration login-decoration-two"></div>
  <section class="login-card" aria-labelledby="login-title">
    <a class="login-back" routerLink="/">← Back to website</a>
    <div class="login-logo-wrap"><img src="/legacy/assist/images/manpower-logo.png" alt="ManpowerGroup Saudi Arabia" /></div>
    <p class="login-eyebrow">ManpowerGroup Saudi Arabia</p>
    <h1 id="login-title">Welcome back</h1>
    <p class="login-subtitle">Sign in to manage your website content, reports, and team access.</p>
    <form class="login-form" (ngSubmit)="submit()">
      <label>Email address<input type="email" name="email" [(ngModel)]="email" autocomplete="username" placeholder="you@example.com" required /></label>
      <label>Password<div class="login-password"><input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Enter your password" required /><button type="button" (click)="showPassword = !showPassword">{{ showPassword ? 'Hide' : 'Show' }}</button></div></label>
      @if (error) { <div class="login-error" role="alert"><span>!</span>{{ error }}</div> }
      <button class="login-submit" type="submit" [disabled]="submitting">{{ submitting ? 'Signing in…' : 'Sign in to dashboard' }}<span>→</span></button>
    </form>
    <p class="login-security">Secure administration area · Authorized users only</p>
  </section>
</main>
